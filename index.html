你现在的努力，是为了以后有更多的选择。",author:"佚名",category:"激励"},{id:9,text:"愿你成为自己的太阳，无需凭借谁的光。",author:"佚名",category:"治愈"},{id:10,text:"不要着急，最好的总会在最不经意的时候出现。",author:"泰戈尔",category:"治愈"},{id:11,text:"你若盛开，清风自来。",author:"三毛",category:"治愈"},{id:12,text:"每个人都是自己命运的建筑师。",author:"苏拉",category:"激励"},{id:13,text:"慢慢来，比较快。",author:"李宗盛",category:"治愈"},{id:14,text:"生活明朗，万物可爱。人间值得，未来可期。",author:"佚名",category:"治愈"},{id:15,text:"所谓无底深渊，下去，也是前程万里。",author:"木心",category:"激励"},{id:16,text:"做一个温柔的人，浅浅笑，轻轻爱。",author:"佚名",category:"治愈"},{id:17,text:"人生没有白走的路，每一步都算数。",author:"李宗盛",category:"人生"},{id:18,text:"愿你眼中有光，心中有爱，脚下有路。",author:"佚名",category:"祝福"},{id:19,text:"再小的努力，乘以365天都很明显。",author:"佚名",category:"激励"},{id:20,text:"心若向阳，无畏悲伤。",author:"佚名",category:"治愈"},{id:21,text:"你的善良，必须有点锋芒。",author:"慕颜歌",category:"人生"},{id:22,text:"活在这珍贵的人间，太阳强烈，水波温柔。",author:"海子",category:"治愈"},{id:23,text:"保持热爱，奔赴山海。",author:"佚名",category:"激励"},{id:24,text:"万物皆有裂痕，那是光照进来的地方。",author:"莱昂纳德·科恩",category:"治愈"},{id:25,text:"你已经做得很好了，我把这句话存在这里，在需要勇气的时候，请替我悄悄说给你自己听。",author:"佚名",category:"治愈"},{id:26,text:"种一棵树最好的时间是十年前，其次是现在。",author:"丹比萨·莫约",category:"激励"},{id:27,text:"愿你所有的快乐，无需假装。",author:"佚名",category:"祝福"},{id:28,text:"生活总会给你答案，但不会马上把一切都告诉你。",author:"佚名",category:"治愈"},{id:29,text:"你很聪明，你很善良，你很重要。",author:"《相助》",category:"治愈"},{id:30,text:"星光不问赶路人，时光不负有心人。",author:"佚名",category:"激励"}];function zd(){const t=new Date,s=Math.floor((t-new Date(t.getFullYear(),0,0))/(1e3*60*60*24))%tn.length;return tn[s]}function Gd(){const t=Math.floor(Math.random()*tn.length);return tn[t]}const ks=[{id:1,title:"清晨的第一缕阳光",description:"伴随着轻柔的音乐，迎接美好的一天",thumbnail:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600&h=400&fit=crop",duration:"3:45",category:"自然",mood:"平静",views:12580,videoUrl:"https://www.w3schools.com/html/mov_bbb.mp4"},{id:2,title:"海边落日",description:"金色的阳光洒在海面上，治愈一切疲惫",thumbnail:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&h=400&fit=crop",duration:"5:20",category:"自然",mood:"放松",views:2
